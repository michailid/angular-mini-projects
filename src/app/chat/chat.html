<div class="max-w-md mx-auto mt-10 h-64 overflow-y-auto p-1 border">
  @for (message of messages; track $index) {
    <div class="bg-gray-200 p-2 rounded m-1">{{ message }}</div>
  }
</div>

<div class="max-w-md mx-auto">
  <input
    type="text"
    class="border my-3 w-full p-2 focus:outline-none"
    placeholder="Write your message here..."
    [(ngModel)]="currentMessage"
    (keydown.enter)="sendMessage()"
  />
</div>
