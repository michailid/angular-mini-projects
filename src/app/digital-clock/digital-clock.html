<div class="bg-gray-900 h-screen flex flex-col justify-center p-5">
  <h1 class="text-white text-5xl text-center font-bold">{{ formatTime('Asia/Kolkata') }}</h1>
  <p class="text-white text-lg text-center mt-2">{{ formatDate('Asia/Kolkata') }}</p>
  <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4 mt-10">
    @for (clock of worldClocks; track $index) {
      <div class="bg-gray-800 rounded-2xl h-fit py-5 px-8">
        <h2 class="font-bold text-white text-lg text-center">{{ clock.country }}</h2>
        <p class="text-green-400 text-2xl font-bold text-center">{{ formatTime(clock.zone) }}</p>
        <p class="text-gray-400 text-center">{{ formatDate(clock.zone) }}</p>
      </div>
    }
  </div>
</div>
